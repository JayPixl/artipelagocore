name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Verify tag, build version and changelog agree
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! grep -qxF "version = \"${version}\"" build.gradle.kts; then
            echo "::error::build.gradle.kts version does not match tag ${GITHUB_REF_NAME}"
            exit 1
          fi
          if ! grep -qF "## [${version}]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${version}]' section for ${GITHUB_REF_NAME}"
            exit 1
          fi
      - name: Extract release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            index($0, "## [" ver "]") == 1 { capture = 1; next }
            capture && index($0, "## [") == 1 { exit }
            capture { print }
          ' CHANGELOG.md | sed -e 's/[[:space:]]*$//' -e '1{/^$/d}' > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::release notes extracted for ${version} are empty"
            exit 1
          fi
          echo "--- CurseForge changelog for ${GITHUB_REF_NAME} ---"
          cat release-notes.md
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: artipelago-${{ github.ref_name }}
          path: build/libs/*.jar
      - name: Publish to CurseForge
        if: env.CURSEFORGE_TOKEN != '' && startsWith(github.ref, 'refs/tags/')
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files-primary: build/libs/*.jar
          name: Artipelago Core ${{ github.ref_name }}
          version: ${{ github.ref_name }}
          version-type: release
          changelog-file: release-notes.md
          loaders: neoforge
          game-versions: 1.21.1
